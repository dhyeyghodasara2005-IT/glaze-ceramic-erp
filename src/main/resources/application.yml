# Settings shared by every environment (dev, test, prod).
# Secrets (passwords, keys) are NOT here - they live in config/application-local.yml (git-ignored).
spring:
  application:
    name: ceramic-erp
  profiles:
    default: dev
  config:
    import: optional:file:./config/application-local.yml

  jpa:
    # Never let Hibernate change tables. Flyway owns the schema; Hibernate only checks it matches.
    hibernate:
      ddl-auto: validate
    # Keep database work inside service methods (prevents slow, hidden queries in controllers).
    open-in-view: false
    properties:
      hibernate:
        # Instants (created_at, posted_at ...) are stored in UTC.
        jdbc:
          time_zone: UTC
        # Wall-clock values (a date, a shift's 20:00, a mill's start time) are stored exactly as
        # typed - never shifted by a time zone - so they mean the same thing to SQL, reports and
        # Python later, whatever zone the server runs in.
        type:
          java_time_use_direct_jdbc: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    issuer: ceramic-erp
    # How long a login stays valid. 12h covers a full shift.
    expiration: 12h
  cors:
    allowed-origins: http://localhost:5173
  bootstrap:
    admin-full-name: System Administrator
