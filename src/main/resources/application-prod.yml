# Production profile: the plant's server. Start it with
#   java -jar glaze.jar --spring.profiles.active=prod
# Passwords stay in config/application-local.yml beside the jar, never here.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ceramic_erp?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8}
  flyway:
    # A real database can never be wiped by a setting left on by mistake.
    clean-disabled: true

server:
  # The app's code is big for a phone on factory Wi-Fi; compressed, it is about a quarter of the size.
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 2KB

# The API documentation is for developers, not for the factory network.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  file:
    name: logs/glaze.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
  level:
    com.ceramicerp: INFO

app:
  cors:
    # The screens now come from this same server, so no other website may call the API.
    allowed-origins: ""
